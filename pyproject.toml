[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rdumtool"
dynamic = ["version"]
description = "RDTech UM24C/UM25C/UM34C Bluetooth interface tool"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
authors = [{name = "Ryan Finnie", email = "ryan@finnie.org"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]

[project.urls]
Homepage = "https://github.com/rjmonna/rdumtool"
Upstream = "https://github.com/rfinnie/rdumtool"

[project.scripts]
rdumtool = "rdum.tool:main"

[tool.setuptools]
packages = ["rdum"]

[tool.setuptools.dynamic]
version = {attr = "rdum.__version__"}
